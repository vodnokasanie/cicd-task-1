name: Deploy to Minikube

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Minikube
      uses: medyagh/setup-minikube@latest
      
    - name: Build Docker image in Minikube
      run: |
        eval $(minikube docker-env)
        docker build -t node-app:local .
        docker images
    
    - name: Deploy to Minikube
      run: |
        kubectl apply -f k8s-node-app.yaml
        kubectl set image deployment/nodejs-app nodejs-app=node-app:local
        kubectl patch deployment nodejs-app -p '{"spec":{"template":{"spec":{"containers":[{"name":"nodejs-app","imagePullPolicy":"Never"}]}}}}'
    
    - name: Wait for deployment
      run: |
        kubectl rollout status deployment/nodejs-app --timeout=90s
        kubectl get pods
        kubectl get services
    
    - name: Test service
      run: |
        kubectl port-forward service/nodejs-app 8080:80 &
        sleep 5
        curl -s http://localhost:8080 | grep "Hello World"
        
    - name: Get service URL
      run: |
        minikube service nodejs-app --url
        
    - name: Show deployment status
      if: always()
      run: |
        kubectl get all
        kubectl describe deployment nodejs-app
        
    - name: Show application logs
      if: always()
      run: |
        POD_NAME=$(kubectl get pods -l app=nodejs-app -o jsonpath='{.items[0].metadata.name}')
        kubectl logs $POD_NAME --tail=50 || echo "Could not fetch logs"