name: Deploy Node.js app to Minikube

# Trigger workflow on push to main branch
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx (optional, for building images)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 3. Set up Minikube
      - name: Set up Minikube
        uses: medyagh/setup-minikube@v2
        with:
          kubernetes-version: v1.27.3
          driver: docker

      # 4. Point Docker to Minikube's Docker daemon
      - name: Use Minikube Docker daemon
        run: eval $(minikube docker-env)

      # 5. Build Docker image inside Minikube
      - name: Build Docker image
        run: docker build -t node-app:latest .

      # 6. Deploy to Kubernetes
      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s-node-app.yaml

      # 7. Wait for pod to be ready
      - name: Wait for pod
        run: kubectl wait --for=condition=ready pod -l app=nodejs-app --timeout=120s

      # 8. List services
      - name: List services
        run: minikube service list

      # 9. Optional: show pod status
      - name: Show pods
        run: kubectl get pods -o wide
